<title>Mega Robno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Raspored: fiksni meni lijevo (drawer na telefonu), ljepljiva gornja traka, sadržaj u mreži kartica. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f7f9fc; --border:#dfe5ed; --border-strong:#c9d2de;
  --text:#152033; --text-2:#526075; --muted:#808ca0;
  --accent:#1f63c8; --accent-hover:#1a54ab; --accent-soft:#e7effb; --on-accent:#ffffff;
  --side-bg:#12203a; --side-text:#c3cee0; --side-muted:#7f8da6; --side-hover:#1b2c4b; --side-active:#24406e;
  --ok:#17773f; --ok-bg:#e2f3e9; --warn:#9a5a00; --warn-bg:#fcefd6; --bad:#bb3128; --bad-bg:#fbe3e1; --info:#245fb0; --info-bg:#e6eefa;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e8ecf2;
  --shadow:0 1px 2px rgba(18,32,58,.06),0 2px 8px rgba(18,32,58,.04);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --side-w:252px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1219; --surface:#151c27; --surface-2:#1a2230; --border:#253042; --border-strong:#334156;
  --text:#e5eaf2; --text-2:#a5b0c2; --muted:#7b879a;
  --accent:#4a8cf0; --accent-hover:#5e9af3; --accent-soft:#1a2b47; --on-accent:#08111f;
  --side-bg:#0a0f17; --side-text:#b9c4d6; --side-muted:#6f7c91; --side-hover:#141d2b; --side-active:#1c2f4f;
  --ok:#4fc283; --ok-bg:#123020; --warn:#e9a640; --warn-bg:#33260e; --bad:#f2766c; --bad-bg:#3b1715; --info:#78a9f5; --info-bg:#172640;
  --s1:#3987e5; --s2:#d95926; --grid:#222c3b;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#151c27; --surface-2:#1a2230; --border:#253042; --border-strong:#334156;
  --text:#e5eaf2; --text-2:#a5b0c2; --muted:#7b879a;
  --accent:#4a8cf0; --accent-hover:#5e9af3; --accent-soft:#1a2b47; --on-accent:#08111f;
  --side-bg:#0a0f17; --side-text:#b9c4d6; --side-muted:#6f7c91; --side-hover:#141d2b; --side-active:#1c2f4f;
  --ok:#4fc283; --ok-bg:#123020; --warn:#e9a640; --warn-bg:#33260e; --bad:#f2766c; --bad-bg:#3b1715; --info:#78a9f5; --info-bg:#172640;
  --s1:#3987e5; --s2:#d95926; --grid:#222c3b;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- meni ---------- */
.app{display:flex;min-height:100%;background:linear-gradient(to right,var(--side-bg) var(--side-w),var(--bg) var(--side-w))}
.sidebar{position:sticky;top:0;height:100vh;flex:none;width:var(--side-w);background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;z-index:50;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));transition:transform .2s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.02em;font-size:13px}
.brand-name{font-weight:600;color:#fff;font-size:15px;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--side-muted)}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-text);text-decoration:none;font-size:13.5px}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:var(--side-hover)}
.nav a.active{background:var(--side-active);color:#fff}
.nav a.active svg{opacity:1}
.nav a .soon{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--side-muted);color:var(--side-muted)}
.nav a .cnt{margin-left:auto;font-size:11px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-weight:600}
.side-foot{border-top:1px solid rgba(255,255,255,.08);margin-top:8px;padding:10px 8px 0;font-size:12px;color:var(--side-muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-foot .ver{white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--side-text)}
.overlay{position:fixed;inset:0;background:rgba(6,10,18,.5);z-index:45}

/* ---------- glavni dio ---------- */
.main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:12px;color:var(--muted)}
.tb-title{min-width:0}
.search{position:relative;margin-left:auto;width:min(380px,40vw)}
.search input{width:100%;height:36px;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:0 12px 0 34px}
.search svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--muted)}
.search-res{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,40,.18);max-height:60vh;overflow:auto;z-index:70;padding:6px}
.search-res button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer}
.search-res button:hover,.search-res button.sel{background:var(--accent-soft)}
.search-res .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12.5px}
.burger{display:none}
.content{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1480px;width:100%}

/* ---------- komponente ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.kpi .val small{font-size:13px;font-weight:500;color:var(--text-2)}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}
a.kpi{color:inherit;text-decoration:none}
a.kpi:hover{border-color:var(--accent)}
.grid{display:grid;gap:18px}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h2{font-size:14.5px;margin:0;font-weight:600}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px 16px}
.card-b.flush{padding:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)} .chip.mute{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.chip.plain::before{display:none}
.confirm-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:5px;background:var(--warn-bg);color:var(--warn);border:1px dashed var(--warn);white-space:nowrap}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;background:var(--warn-bg);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:13px}
.note svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:1px}
.note.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)} .note.info svg{color:var(--info)}
input.inp,select.inp,textarea.inp{height:36px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0}
textarea.inp{height:auto;padding:8px 10px}
input.inp:focus,select.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.n{text-align:right;font-variant-numeric:tabular-nums}
.inp.sm{height:30px;padding:0 8px;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--text-2);font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .c{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:0 6px;margin-left:5px;color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.seg button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl th.num{text-align:right}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--border-strong);padding:10px 12px}
.tbl tr.storno td{color:var(--muted)}
.tbl tr.storno td .strike{text-decoration:line-through}
.tbl td.diff-plus{color:var(--ok);font-weight:600} .tbl td.diff-minus{color:var(--bad);font-weight:600}
.tbl .name{font-weight:500}
.tbl td.mono{white-space:nowrap}
.tbl .sub{font-size:12px;color:var(--muted)}
.tbl input.inp{width:100%}
.empty{padding:30px;text-align:center;color:var(--muted)}
.totals{display:grid;grid-template-columns:auto auto;gap:6px 22px;justify-content:end;font-variant-numeric:tabular-nums}
.totals .k{color:var(--text-2);text-align:right} .totals .v{text-align:right;font-weight:500}
.totals .big{font-size:17px;font-weight:700;color:var(--text)}
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-in{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:5px}
.bar-in span{display:block;height:100%;background:var(--s1);border-radius:3px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5}
.soon-page{display:grid;place-items:center;padding:40px 0}
.soon-card{max-width:620px;width:100%}
.soon-card ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--text-2)} .kv dd{margin:0}
.audit{display:flex;flex-direction:column}
.audit-row{display:grid;grid-template-columns:130px 90px 1fr;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.audit-row:last-child{border-bottom:0}

/* ---------- modal, toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--border)}
.modal.wide{max-width:1000px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:16px}
.modal-h .x{margin-left:auto}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:11px 16px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:90;max-width:min(440px,calc(100vw - 40px));font-size:13.5px}

/* dokument (izgled PDF-a) */
.paper{background:#fff;color:#1b2230;border:1px solid var(--border);border-radius:6px;padding:28px 30px;font-size:12.5px;box-shadow:var(--shadow)}
.paper h4{margin:0;font-size:20px;letter-spacing:.02em}
.paper .ph{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid #1f63c8;padding-bottom:12px;margin-bottom:14px}
.paper .pp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.paper .box{border:1px solid #d5dbe4;border-radius:5px;padding:9px 11px}
.paper .box b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#6b778a;margin-bottom:3px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 12px}
.paper th{background:#eef2f7;color:#4b5668;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px;text-align:left}
.paper td{padding:6px;border-bottom:1px solid #e3e8ee}
.paper .tt{display:grid;grid-template-columns:auto auto;gap:4px 24px;justify-content:end;font-variant-numeric:tabular-nums}
.paper .tt .g{font-weight:700;font-size:14px;border-top:1px solid #1b2230;padding-top:4px}
.paper .pf{margin-top:24px;display:flex;justify-content:space-between;gap:20px;color:#6b778a;font-size:11px}
.paper .stamp{color:#bb3128;border:2px solid #bb3128;display:inline-block;padding:2px 10px;font-weight:700;transform:rotate(-6deg);letter-spacing:.1em}
.paper-wrap{overflow-x:auto} .paper-wrap .paper{min-width:600px}

.tree{display:flex;flex-direction:column;padding:6px}
.tree button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:600}
.tree button.lvl1{padding-left:32px;font-weight:400;font-size:13px}
.tree button:hover{background:var(--surface-2)} .tree button.sel{background:var(--accent-soft);color:var(--accent)}
.tree .meta{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400;white-space:nowrap}
.newdoc{position:relative}
.newdoc .search-res{left:auto;right:0;width:min(400px,92vw)}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--border);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;padding:2px 0 12px}
.timeline .ev::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.code{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.tabs .code{margin-right:4px}

/* ---------- telefon ---------- */
@media (max-width:1100px){ .g-2-1,.g-1-1{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .app{background:var(--bg)}
  .sidebar{position:fixed;inset:0 auto 0 0;height:auto;transform:translateX(-105%)}
  .sidebar.open{transform:none;box-shadow:10px 0 40px rgba(0,0,0,.4)}
  .main{margin-left:0}
  .burger{display:grid}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px;flex-wrap:wrap}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;gap:14px}
  .search{order:9;width:100%;margin-left:0}
  .tb-spacer{margin-left:auto}

// Kalkulacija: zavisni troškovi se raspoređuju po vrijednosti stavke
function kalk(doc){
  const kurs = doc.valuta === 'EUR' ? CONFIG.kursEUR : 1;
  const rows = doc.stavke.map(s => {
    const a = ART[s.artId];
    const fcKM = r4(s.fc * kurs);
    const nabC = r4(fcKM * (1 - (s.rabat || 0) / 100));
    const nabV = r2(nabC * s.kol);
    return { s, a, fcKM, nabC, nabV };
  });
  const fakturna = r2(sum(rows, r => r.nabV));
  const t = doc.tr; const totTr = r2((t.prevoz||0) + (t.carina||0) + (t.spedicija||0) + (t.ostalo||0));
  rows.forEach(r => { r.udio = fakturna ? r.nabV / fakturna : 0; r.trosak = r2(totTr * r.udio); });
  const resid = r2(totTr - sum(rows, r => r.trosak));
  if (resid && rows.length){ const big = rows.reduce((m, r) => r.nabV > m.nabV ? r : m, rows[0]); big.trosak = r2(big.trosak + resid); }
  rows.forEach(r => {
    r.novaV = r2(r.nabV + r.trosak);
    r.novaC = r.s.kol ? r4(r.novaV / r.s.kol) : 0;
    r.vp = r.s.vp != null ? r.s.vp : r.a.vp;
    r.vpV = r2(r.vp * r.s.kol);
    r.ruc = r2(r.vpV - r.novaV);
    r.marza = r.novaC ? (r.vp - r.novaC) / r.novaC * 100 : 0;
    r.mpc = r2(r.vp * (1 + CONFIG.pdvStopa / 100));
  });
  return { rows, fakturna, totTr, nova:r2(sum(rows, r => r.novaV)), vpV:r2(sum(rows, r => r.vpV)), ruc:r2(sum(rows, r => r.ruc)) };
}

function drawTop(){

  const top = Object.entries(agg).sort((a, b) => b[1].iznos - a[1].iznos).slice(0, 7);
  const max = top.length ? top[0][1].iznos : 1;

}
function drawChart(){
  const months = []; for (let m = 4; m <= 10; m++) months.push('2026-' + p2(m + 1));
  const data = months.map(k => ({ k, ul:sum(ULAZ.filter(u => mKey(u.datum) === k), u => u.k.nova), iz:sum(IZLAZ.filter(d => mKey(d.datum) === k && !d.storno), d => d.osnovica) }));
  const W = 660, H = 250, pl = 54, pr = 10, pt = 14, pb = 30;
  const maxV = Math.max(...data.map(d => Math.max(d.ul, d.iz)));
  const step = maxV > 40000 ? 10000 : 5000; const top = Math.ceil(maxV / step) * step;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const gw = (W - pl - pr) / data.length, bw = Math.min(26, gw * .3);
  const bar = (x, v) => { const h = (H - pb) - y(v); if (h <= 0) return ''; const r = Math.min(4, h); const yt = y(v); return `M${x},${H - pb}V${yt + r}Q${x},${yt} ${x + r},${yt}H${x + bw - r}Q${x + bw},${yt} ${x + bw},${yt + r}V${H - pb}Z`; };
  let g = '';
  for (let v = 0; v <= top; v += step){ g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v ? fmt(v / 1000, 0) + 'k' : '0'}</text>`; }
  data.forEach((d, i) => {
    const cx = pl + gw * i + gw / 2; const x1 = cx - bw - 1, x2 = cx + 1;
    const lbl = MJ_KR[+d.k.slice(5) - 1] + (d.k === '2026-11' ? ' (do 9.)' : '');
    g += `<path d="${bar(x1, d.ul)}" fill="var(--s1)"/><path d="${bar(x2, d.iz)}" fill="var(--s2)"/>`;
    g += `<text x="${cx}" y="${H - 10}" text-anchor="middle">${lbl}</text>`;
    g += `<rect x="${pl + gw * i}" y="${pt}" width="${gw}" height="${H - pt - pb}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ulazi i izlazi po mjesecima">${g}</svg><div class="tip" hidden></div>`;
  const tip = $('#chart .tip');
  $('#chart').querySelectorAll('.hit').forEach(r => {
    r.addEventListener('mouseenter', () => { const d = data[+r.dataset.i]; const box = $('#chart').getBoundingClientRect(), rb = r.getBoundingClientRect();
      tip.innerHTML = `<b>${MJESECI[+d.k.slice(5) - 1]} 2026</b><br>Ulaz: ${km(d.ul)}<br>Izlaz VP: ${km(d.iz)}`; tip.hidden = false;
      tip.style.left = (rb.left - box.left + rb.width / 2) + 'px'; tip.style.top = (y(Math.max(d.ul, d.iz)) / H * box.height) + 'px'; r.setAttribute('fill', 'color-mix(in srgb, var(--text) 5%, transparent)'); });
    r.addEventListener('mouseleave', () => { tip.hidden = true; r.setAttribute('fill', 'transparent'); });
  });
  $('#chartTbl').innerHTML = `<table class="tbl"><thead><tr><th>Mjesec</th><th class="num">Ulaz</th><th class="num">Izlaz VP</th></tr></thead><tbody>${data.map(d => `<tr><td>${MJESECI[+d.k.slice(5) - 1]}</td><td class="num">${fmt(d.ul)}</td><td class="num">${fmt(d.iz)}</td></tr>`).join('')}</tbody></table>`;
}

function kalkTable(k, valuta){
  return `<div class="table-wrap" style="border:1px solid var(--border);border-radius:8px"><table class="tbl"><thead><tr><th>Artikl</th><th class="num">Kol.</th><th class="num">Fakt. cij. (${valuta})</th><th class="num">Rabat</th><th class="num">Nab. vr. KM</th><th class="num">Zav. trošak</th><th class="num">Nova nab. cij.</th><th class="num">VP cij.</th><th class="num">RUC %</th><th class="num">MPC</th></tr></thead><tbody>
  ${k.rows.map(r => `<tr><td><span class="mono">${r.a.sifra}</span> ${esc(r.a.naziv)}</td><td class="num">${fq(r.s.kol, r.a.jm)} ${r.a.jm}</td><td class="num">${fmt(r.s.fc)}</td><td class="num">${r.s.rabat ? fmt(r.s.rabat, 0) + ' %' : '—'}</td><td class="num">${fmt(r.nabV)}</td><td class="num">${fmt(r.trosak)}</td><td class="num"><b>${fmt(r.novaC, 4)}</b></td><td class="num">${fmt(r.vp)}</td><td class="num">${fmt(r.marza, 1)}</td><td class="num">${fmt(r.mpc)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="4">Ukupno</td><td class="num">${fmt(k.fakturna)}</td><td class="num">${fmt(k.totTr)}</td><td class="num">${fmt(k.nova)}</td><td class="num">${fmt(k.vpV)}</td><td class="num">${fmt(k.nova ? k.ruc / k.nova * 100 : 0, 1)}</td><td></td></tr></tfoot></table></div>`;
}
function openKalk(id){
  const u = ULAZ[id], d = DOB[u.dobId];
  modal(`${u.kal} · ${esc(d.naziv)}`, `
    <dl class="kv"><dt>Faktura dobavljača</dt><dd class="mono">${esc(u.brojDob)} od ${fd(u.datum)}</dd><dt>Interni broj</dt><dd class="mono">${u.uf}</dd><dt>Valuta / kurs</dt><dd>${u.valuta}${u.valuta === 'EUR' ? ' · 1 EUR = ' + fmt(CONFIG.kursEUR, 5) + ' KM' : ''}</dd>
    <dt>Zavisni troškovi</dt><dd>prevoz ${km(u.tr.prevoz)} · carina ${km(u.tr.carina)} · špedicija ${km(u.tr.spedicija)} — raspored: ${CONFIG.rasporedTroskova.toLowerCase()}</dd>
    <dt>Plaćanje</dt><dd>${statusPlac(u.placeno, u.ukupno, u.rokDat, u.storno)} rok ${fd(u.rokDat)} · plaćeno ${km(u.placeno)} od ${km(u.ukupno)}</dd><dt>Proknjižio</dt><dd>${u.korisnik}, ${fd(u.datum)}</dd></dl>
    ${kalkTable(u.k, u.valuta)}`,
    `<button class="btn btn-danger" data-act="st">${ico('undo')}Storniraj kalkulaciju</button><button class="btn" data-act="pdf">${ico('file')}PDF kalkulacije</button><button class="btn btn-primary" data-close>Zatvori</button>`, true);
  $('[data-act="st"]').onclick = () => askConfirm('Storno kalkulacije ' + u.kal, 'Kalkulacija se ne briše. Pravi se storno dokument koji vraća zalihu na stanje prije ulaza, a original ostaje vidljiv s oznakom „Storniran".', 'Napravi storno', () => toast('U previewu storno kalkulacije je isključen. U pravoj aplikaciji pravi se ST dokument i upis u trag promjena.'));
  $('[data-act="pdf"]').onclick = () => toast('PDF kalkulacije dolazi u fazi 1 (isti izgled kao račun).');
}

let KF = null;
function newKalkDraft(){
  const ids = [1, 4, 10, 13, 26];
  return { dobId:1, brojDob:'RE-' + 268431, datum:TODAY, valuta:'EUR', rok:30, napomena:'', tr:{ prevoz:285, carina:0, spedicija:95, ostalo:0 },
    stavke: ids.map((id, i) => { const a = ART[id]; return { artId:id, kol:[24, 36, 12, 6, 120][i], fc:r2(a.nab / CONFIG.kursEUR * .945), rabat:i === 1 ? 3 : 0, vp:a.vp }; }) };
}
function renderKalkForm(){
  setTitle('Nova kalkulacija', 'Ulaz robe');
  if (!KF) KF = newKalkDraft();
  const robniDob = DOBS.filter(d => d.vrsta === 'Roba');
  $('#view').innerHTML = `
  <div class="toolbar"><a class="btn" href="#ulaz">← Lista kalkulacija</a><div class="grow"></div>${KF.nd ? '<span class="chip mute plain">iz narudžbe ' + KF.nd + '</span>' : ''}<span class="code">${KF.valuta === 'EUR' ? '110' : '100'}</span><span class="chip info">Nacrt – nije proknjiženo</span></div>
  <div class="card"><div class="card-h"><h2>1. Ulazna faktura dobavljača</h2></div><div class="card-b"><div class="form-grid">
    <div class="field" style="grid-column:span 2"><label for="kDob">Dobavljač</label><select class="inp" id="kDob">${robniDob.map(d => `<option value="${d.id}" ${KF.dobId === d.id ? 'selected' : ''}>${esc(d.naziv)} (${d.tip === 'EU' ? d.drzava : 'BiH'})</option>`).join('')}</select></div>
    <div class="field"><label for="kBr">Broj fakture dobavljača</label><input class="inp" id="kBr" value="${esc(KF.brojDob)}"></div>
    <div class="field"><label for="kDat">Datum fakture</label><input class="inp" id="kDat" value="${fd(KF.datum)}"></div>
    <div class="field"><label for="kVal">Valuta</label><select class="inp" id="kVal"><option ${KF.valuta === 'EUR' ? 'selected' : ''}>EUR</option><option ${KF.valuta === 'KM' ? 'selected' : ''}>KM</option></select></div>
    <div class="field"><label>Kurs</label><input class="inp n" value="${KF.valuta === 'EUR' ? fmt(CONFIG.kursEUR, 5) : '1,00000'}" disabled></div>
    <div class="field"><label for="kRok">Rok plaćanja (dana)</label><input class="inp n" id="kRok" value="${KF.rok}"></div>
  </div></div></div>

  <div class="card"><div class="card-h"><h2>2. Stavke i kalkulacija</h2><div class="right"><span class="muted" style="font-size:12.5px">Žuta polja se mijenjaju, ostalo se računa samo</span></div></div>
    <div class="table-wrap"><table class="tbl" id="kTbl"><thead><tr><th style="min-width:240px">Artikl</th><th class="num">Količina</th><th class="num">Fakt. cijena (<span id="kValLbl">${KF.valuta}</span>)</th><th class="num">Rabat %</th><th class="num">Nab. vrijednost KM</th><th class="num">Zav. trošak</th><th class="num">Nova nab. cijena</th><th class="num">Stara nab.</th><th class="num">VP cijena</th><th class="num">RUC %</th><th class="num">MPC s PDV</th><th></th></tr></thead>
    <tbody id="kBody"></tbody><tfoot id="kFoot"></tfoot></table></div>
    <div class="card-b"><button class="btn" id="kAdd">${ico('plus')}Dodaj stavku</button></div>
  </div>

  <div class="grid g-1-1">
    <div class="card"><div class="card-h"><h2>3. Zavisni troškovi (KM)</h2><div class="right"><span class="chip mute plain">Raspored: ${CONFIG.rasporedTroskova.toLowerCase()}</span></div></div><div class="card-b"><div class="form-grid">
      ${[['prevoz','Prevoz'],['carina','Carina'],['spedicija','Špedicija'],['ostalo','Ostalo']].map(([k, l]) => `<div class="field"><label for="kt_${k}">${l}</label><input class="inp n edit" id="kt_${k}" data-tr="${k}" inputmode="decimal" value="${fmt(KF.tr[k])}"></div>`).join('')}
    </div>
    <div class="note info" style="margin-top:14px">${ico('info')}<div>Trošak se dijeli na stavke srazmjerno njihovoj nabavnoj vrijednosti. PDV iz JCI (uvoz) i PDV na fakturama prevoznika/špeditera ne ulaze u nabavnu cijenu, nego idu u KUF. ${confirmTag()}</div></div></div></div>
    <div class="card"><div class="card-h"><h2>4. Rezime</h2></div><div class="card-b" id="kSum"></div>
      <div class="modal-f" style="border-top:1px solid var(--border)"><button class="btn" id="kDraft">Sačuvaj nacrt</button><button class="btn btn-primary" id="kPost">${ico('in')}Proknjiži – zaliha raste</button></div></div>
  </div>`;
  const css = document.createElement('style'); css.textContent = '.edit{background:color-mix(in srgb,var(--warn-bg) 70%,var(--surface))!important}'; $('#view').appendChild(css);
  drawKalkRows();
  $('#kDob').onchange = e => { KF.dobId = +e.target.value; const d = DOB[KF.dobId]; KF.valuta = d.valuta; KF.rok = d.rok; renderKalkForm(); };
  $('#kVal').onchange = e => { KF.valuta = e.target.value; renderKalkForm(); };
  $('#kBr').oninput = e => KF.brojDob = e.target.value;
  $('#kRok').oninput = e => KF.rok = parseNum(e.target.value);
  document.querySelectorAll('[data-tr]').forEach(inp => { inp.oninput = () => { KF.tr[inp.dataset.tr] = parseNum(inp.value); updKalk(); }; inp.onblur = () => inp.value = fmt(KF.tr[inp.dataset.tr]); });
  $('#kAdd').onclick = () => { const used = new Set(KF.stavke.map(s => s.artId)); const a = ART.find(x => x.dobId === KF.dobId && !used.has(x.id)) || ART[0]; KF.stavke.push({ artId:a.id, kol:1, fc:r2(a.nab / (KF.valuta === 'EUR' ? CONFIG.kursEUR : 1) * .95), rabat:0, vp:a.vp }); drawKalkRows(); };
  $('#kDraft').onclick = () => toast('Nacrt sačuvan (demo). Nacrt ne mijenja zalihu.');
  $('#kPost').onclick = () => {
    const k = kalk(KF);
    if (!KF.stavke.length) return toast('Dodaj bar jednu stavku.');
    askConfirm('Proknjiži kalkulaciju', `Zaliha raste za ${KF.stavke.length} artikala, nabavna vrijednost ${km(k.nova)}. Nakon knjiženja kalkulacija se može samo stornirati, ne i obrisati.`, 'Proknjiži', () => postKalk());
  };
}
function drawKalkRows(){
  $('#kBody').innerHTML = KF.stavke.map((s, i) => `<tr data-i="${i}">
    <td><select class="inp sm" data-f="artId">${ART.map(a => `<option value="${a.id}" ${a.id === s.artId ? 'selected' : ''}>${a.sifra} · ${esc(a.naziv)}</option>`).join('')}</select></td>
    <td><input class="inp sm n edit" data-f="kol" inputmode="decimal" value="${fq(s.kol, ART[s.artId].jm)}" style="width:80px"></td>
    <td><input class="inp sm n edit" data-f="fc" inputmode="decimal" value="${fmt(s.fc)}" style="width:96px"></td>
    <td><input class="inp sm n edit" data-f="rabat" inputmode="decimal" value="${fmt(s.rabat, 0)}" style="width:58px"></td>
    <td class="num" data-c="nabV"></td><td class="num" data-c="trosak"></td><td class="num" data-c="novaC" style="font-weight:600"></td><td class="num muted">${fmt(ART[s.artId].nab)}</td>
    <td><input class="inp sm n edit" data-f="vp" inputmode="decimal" value="${fmt(s.vp)}" style="width:90px"></td>
    <td class="num" data-c="marza"></td><td class="num" data-c="mpc"></td>
    <td><button class="icon-btn" style="width:30px;height:30px" data-del aria-label="Ukloni stavku">${ico('trash')}</button></td></tr>`).join('');
  $('#kBody').querySelectorAll('tr').forEach(tr => {
    const s = KF.stavke[+tr.dataset.i];
    tr.querySelectorAll('[data-f]').forEach(inp => {
      if (inp.tagName === 'SELECT') inp.onchange = () => { s.artId = +inp.value; s.vp = ART[s.artId].vp; drawKalkRows(); };
      else { inp.oninput = () => { s[inp.dataset.f] = parseNum(inp.value); updKalk(); }; inp.onblur = () => { const f = inp.dataset.f; inp.value = f === 'kol' ? fq(s.kol, ART[s.artId].jm) : f === 'rabat' ? fmt(s.rabat, 0) : fmt(s[f]); }; }
    });
    tr.querySelector('[data-del]').onclick = () => { KF.stavke.splice(+tr.dataset.i, 1); drawKalkRows(); };
  });
  updKalk();
}
function updKalk(){
  const k = kalk(KF);
  $('#kBody').querySelectorAll('tr').forEach((tr, i) => { const r = k.rows[i]; if (!r) return;
    tr.querySelector('[data-c="nabV"]').textContent = fmt(r.nabV); tr.querySelector('[data-c="trosak"]').textContent = fmt(r.trosak);
    tr.querySelector('[data-c="novaC"]').textContent = fmt(r.novaC, 4);
    const m = tr.querySelector('[data-c="marza"]'); m.textContent = fmt(r.marza, 1); m.style.color = r.marza < 15 ? 'var(--bad)' : '';
    tr.querySelector('[data-c="mpc"]').textContent = fmt(r.mpc); });
  $('#kFoot').innerHTML = `<tr><td colspan="4">Ukupno (${k.rows.length} stavki)</td><td class="num">${fmt(k.fakturna)}</td><td class="num">${fmt(k.totTr)}</td><td class="num">${fmt(k.nova)}</td><td></td><td class="num">${fmt(k.vpV)}</td><td class="num">${fmt(k.nova ? k.ruc / k.nova * 100 : 0, 1)}</td><td colspan="2"></td></tr>`;
  const eu = KF.valuta === 'EUR';
  const pdvUl = eu ? 0 : r2(k.fakturna * CONFIG.pdvStopa / 100);
  $('#kSum').innerHTML = `<div class="totals">
    <span class="k">Fakturna vrijednost${eu ? ' (' + fmt(sum(KF.stavke, s => s.kol * s.fc * (1 - s.rabat / 100))) + ' EUR)' : ''}</span><span class="v">${km(k.fakturna)}</span>
    <span class="k">+ Zavisni troškovi</span><span class="v">${km(k.totTr)}</span>
    <span class="k big">Nabavna vrijednost robe</span><span class="v big">${km(k.nova)}</span>
    <span class="k">Prodajna vrijednost (VP, bez PDV)</span><span class="v">${km(k.vpV)}</span>
    <span class="k">Razlika u cijeni (RUC)</span><span class="v">${km(k.ruc)} · ${fmt(k.nova ? k.ruc / k.nova * 100 : 0, 1)} %</span>
    <span class="k">${eu ? 'PDV pri uvozu – iz JCI (ide u KUF)' : 'Ulazni PDV ' + CONFIG.pdvStopa + ' % (ide u KUF)'}</span><span class="v">${eu ? km(r2((k.fakturna + KF.tr.prevoz + KF.tr.carina) * CONFIG.pdvStopa / 100)) + ' *' : km(pdvUl)}</span>
    <span class="k">Obaveza prema dobavljaču</span><span class="v">${km(k.fakturna + pdvUl)}</span></div>
    ${eu ? '<p class="muted" style="font-size:12px;margin:10px 0 0;text-align:right">* procjena; tačan iznos se upisuje iz JCI. ' + confirmTag() + '</p>' : ''}`;
}
function postKalk(){
  const k = kalk(KF); const i = ULAZ.length;
  const doc = { ...KF, id:i, kal:'KAL-2026-' + String(i + 1).padStart(3, '0'), uf:'UF-2026-' + String(i + 1).padStart(3, '0'), k, korisnik:'Admin', storno:false };
  doc.pdv = KF.valuta === 'EUR' ? 0 : r2(k.fakturna * .17); doc.ukupno = r2(k.fakturna + doc.pdv); doc.placeno = 0; doc.rokDat = addDays(KF.datum, KF.rok);
  ULAZ.push(doc);
  if (KF.nd) zatvoriNarudzbu(ND, KF.nd, KF.stavke);
  k.rows.forEach(r => { if (r.a.serijski) for (let i = 0; i < r.s.kol; i++) SERIJE.push({ sn:r.a.sifra.replace('-', '') + '-26' + String(9000 + (++snC)).slice(-4), artId:r.a.id, ulDok:doc.kal, ulDatum:KF.datum, status:'Na stanju', kupId:null, racun:null, prodato:null, garDo:null }); });
  k.rows.forEach(r => { const a = r.a; const novoSt = r2(a.stanje + r.s.kol); if (novoSt > 0) a.nab = r2((a.stanje * a.nab + r.novaV) / novoSt); a.stanje = novoSt; a.vp = r.vp; a.mpc = r2(mpcOf(r.vp));
    MOV[a.id].push({ datum:KF.datum, dok:doc.kal, opis:DOB[doc.dobId].naziv, ul:r.s.kol, iz:0 }); });
  audit(new Date(), 'Admin', 'Proknjižio kalkulaciju', doc.kal);
  KF = null;
  toast(`${doc.kal} proknjižena. Zaliha je povećana, nabavne cijene preračunate (ponderisani prosjek).`);
  location.hash = 'ulaz';
}

/* ---------- IZLAZNI DOKUMENTI ---------- */
ROUTES.izlaz = h => {
  if (h === 'izlaz-novi') return renderRacunForm();
  setTitle('Izlazni dokumenti', 'Veleprodaja');
  const tabs = [['racuni','<span class="code">300</span>Računi',IZLAZ.length],['otpremnice','<span class="code">310</span>Otpremnice',OTP.length],['predracuni','<span class="code">320</span>Predračuni',PRED.length],['povrati','<span class="code">150 · 400</span>Povrati i storna',POVRAT.length + STORNA.length]];
  const mj = mKey(TODAY);
  const izMj = IZLAZ.filter(d => mKey(d.datum) === mj && !d.storno);
  const potr = IZLAZ.filter(d => !d.storno && d.placeno < d.ukupno - .005);
  $('#view').innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Fakturisano – ${MJESECI[TODAY.getMonth()]}</div><div class="val">${fmt(sum(izMj, d => d.ukupno))} <small>KM</small></div><div class="sub">${izMj.length} računa · s PDV</div></div>
    <div class="kpi"><div class="lbl">Potraživanja od kupaca</div><div class="val">${fmt(sum(potr, d => d.ukupno - d.placeno))} <small>KM</small></div><div class="sub">${potr.length} otvorenih računa</div></div>
    <div class="kpi"><div class="lbl">Dospjelo, nenaplaćeno</div><div class="val" style="color:var(--bad)">${fmt(sum(potr.filter(d => d.rokDat < TODAY), d => d.ukupno - d.placeno))} <small>KM</small></div><div class="sub">${potr.filter(d => d.rokDat < TODAY).length} računa</div></div>
  </div>
  <div class="card">
    <div class="tabs" id="izTabs" style="padding:0 8px">${tabs.map(([id, t, c]) => `<button data-t="${id}" class="${STATE.izlazTab === id ? 'active' : ''}">${t}<span class="c">${c}</span></button>`).join('')}</div>
    <div class="card-h" style="border-top:0"><div class="toolbar" style="width:100%"><input class="inp grow" id="izQ" placeholder="Broj dokumenta ili kupac…" value="${esc(STATE.izlazQ)}" style="min-width:160px">
      <select class="inp" id="izS"><option value="">Svi statusi</option>${['Plaćeno','Neplaćeno','Djelimično','Dospjelo','Storniran'].map(s => `<option ${STATE.izlazStatus === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <a class="btn btn-primary" href="#izlaz-novi">${ico('plus')}Novi račun</a></div></div>
    <div class="table-wrap"><table class="tbl" id="izTbl"></table></div>
  </div>`;
  $('#izTabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; STATE.izlazTab = b.dataset.t; ROUTES.izlaz('izlaz'); };
  $('#izQ').oninput = e => { STATE.izlazQ = e.target.value; drawIzlaz(); };
  $('#izS').onchange = e => { STATE.izlazStatus = e.target.value; drawIzlaz(); };
  drawIzlaz();
};
function statusTxt(d){ return d.storno ? 'Storniran' : d.placeno >= d.ukupno - .005 ? 'Plaćeno' : d.placeno > 0 ? 'Djelimično' : d.rokDat < TODAY ? 'Dospjelo' : 'Neplaćeno'; }
function drawIzlaz(){
  const q = STATE.izlazQ.toLowerCase(), t = STATE.izlazTab;
  const mq = (broj, kupId) => !q || (broj + KUP[kupId].naziv).toLowerCase().includes(q);
  let html = '';
  if (t === 'racuni'){
    const rows = [...IZLAZ].reverse().filter(d => mq(d.broj, d.kupId) && (!STATE.izlazStatus || statusTxt(d) === STATE.izlazStatus)).slice(0, 120);
    html = `<thead><tr><th>Račun</th><th>Datum</th><th>Kupac</th><th class="hide-sm">Otpremnica</th><th class="num">Osnovica</th><th class="num">PDV</th><th class="num">Ukupno</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(d => `<tr class="click ${d.storno ? 'storno' : ''}" data-r="${d.id}"><td class="mono"><span class="strike">${d.broj}</span></td><td>${fd(d.datum)}</td><td class="name">${esc(KUP[d.kupId].naziv)}<div class="sub">${KUP[d.kupId].grad} · ${d.nacin}</div></td><td class="mono hide-sm t2">${d.otp || '—'}</td><td class="num">${fmt(d.osnovica)}</td><td class="num">${fmt(d.pdv)}</td><td class="num"><b class="strike">${fmt(d.ukupno)}</b></td><td>${statusPlac(d.placeno, d.ukupno, d.rokDat, d.storno)}</td><td><button class="btn btn-sm">${ico('file')}PDF</button></td></tr>`).join('')}</tbody>`;
  } else if (t === 'otpremnice'){
    const rows = [...OTP].reverse().filter(o => mq(o.broj, o.kupId)).slice(0, 120);
    html = `<thead><tr><th>Otpremnica</th><th>Datum</th><th>Kupac</th><th>Račun</th><th class="num">Stavki</th><th>Izdao</th><th></th></tr></thead><tbody>${rows.map(o => `<tr class="click" data-o="${o.broj}"><td class="mono">${o.broj}</td><td>${fd(o.datum)}</td><td class="name">${esc(KUP[o.kupId].naziv)}</td><td class="mono">${o.racun}</td><td class="num">${o.stavke.length}</td><td>${o.korisnik}</td><td><button class="btn btn-sm">${ico('file')}PDF</button></td></tr>`).join('')}</tbody>`;
  } else if (t === 'predracuni'){
    const rows = [...PRED].reverse().filter(p => mq(p.broj, p.kupId));

  if (s.kupId != null) docs = [...IZLAZ.filter(d => d.kupId === s.kupId)].reverse().map(d => ({ broj:d.broj, datum:d.datum, opis:d.otp ? 'uz ' + d.otp : d.nacin, rok:d.rokDat, uk:d.ukupno, pl:d.placeno, st:d.storno }));
  else docs = [...ULAZ.filter(u => u.dobId === s.dobId).map(u => ({ broj:u.brojDob, datum:u.datum, opis:u.kal, rok:u.rokDat, uk:u.ukupno, pl:u.placeno })), ...USLUGE.filter(u => u.dobId === s.dobId).map(u => ({ broj:u.broj, datum:u.datum, opis:u.opis, rok:u.rokDat, uk:u.ukupno, pl:u.placeno ? u.ukupno : 0 }))].sort((a, b) => b.datum - a.datum);
  modal(`${s.sifra} · ${esc(s.naziv)}`, `<dl class="kv"><dt>Tip</dt><dd>${s.tipovi.join(', ')}</dd><dt>Mjesto</dt><dd>${esc(s.mjesto)}</dd><dt>ID / PDV broj</dt><dd class="mono">${s.idBroj}</dd><dt>Grupa</dt><dd>${s.grupa}</dd><dt>Valuta / rok</dt><dd>${s.valuta} · ${s.rok ? s.rok + ' dana' : 'odmah'}</dd><dt>Prioritet isporuke</dt><dd>${s.prioritet}</dd><dt>Saldo</dt><dd><b>${km(subjSaldo(s))}</b></dd></dl>
    <div class="table-wrap" style="border:1px solid var(--border);border-radius:8px;max-height:320px;overflow:auto"><table class="tbl"><thead><tr><th>Dokument</th><th>Datum</th><th>Opis</th><th>Dospijeće</th><th class="num">Iznos</th><th>Status</th></tr></thead><tbody>
    ${docs.map(d => `<tr class="${d.st ? 'storno' : ''}"><td class="mono">${esc(d.broj)}</td><td>${fd(d.datum)}</td><td class="t2">${esc(d.opis)}</td><td>${fd(d.rok)}</td><td class="num">${fmt(d.uk)}</td><td>${statusPlac(d.pl, d.uk, d.rok, d.st)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nema dokumenata.</td></tr>'}</tbody></table></div>`,

  const b = $('[data-act="ios"]'); if (b) b.onclick = () => openIOS(key);
}

/* ---------- FORMULE CIJENA I POPUSTA ---------- */
ROUTES.formule = () => {
  setTitle('Cijene i popusti', 'Šifarnici');
  STATE.ft = STATE.ft || { kupId:1, artId:7, kol:3 };
  const opis = f => [f.kupId != null ? 'kupac: ' + KUP[f.kupId].naziv : f.grupaKup ? 'grupa kupaca: ' + f.grupaKup : 'svi kupci', f.grupaArt ? 'artikli: ' + grpPath(f.grupaArt) : f.rinfuza ? 'artikli u rinfuzi (l, kg)' : 'svi artikli', f.minKol ? 'od ' + fmt(f.minKol, 0) + ' kom/l/kg' : ''].filter(Boolean).join(' · ');
  const vazi = f => f.od ? fd(f.od) + ' – ' + fd(f.do) : 'stalno';
  const aktivnoSada = f => f.aktivna && (!f.od || (TODAY >= f.od && TODAY <= f.do));
  $('#view').innerHTML = `
  <div class="card"><div class="card-h"><h2>Pravila popusta</h2><div class="right"><span class="muted" style="font-size:12.5px">Kad važi više pravila:</span><div class="seg" id="fMode"><button data-m="prioritet" class="${FORM_MODE === 'prioritet' ? 'active' : ''}">Prvo po prioritetu</button><button data-m="najveci" class="${FORM_MODE === 'najveci' ? 'active' : ''}">Najveći popust</button></div><button class="btn btn-primary btn-sm" id="fNew">${ico('plus')}Novo pravilo</button></div></div>
  <div class="table-wrap"><table class="tbl"><thead><tr><th class="num">Prioritet</th><th>Naziv</th><th>Kome i na šta</th><th class="num">Popust</th><th>Važi</th><th>Status</th></tr></thead><tbody>
  ${FORMULE.map(f => `<tr><td class="num">${f.prio}</td><td class="name">${esc(f.naziv)}</td><td class="t2">${esc(opis(f))}</td><td class="num"><b>${fmt(f.popust, 0)} %</b></td><td>${vazi(f)}</td><td>${aktivnoSada(f) ? '<span class="chip ok">Važi danas</span>' : '<span class="chip mute">Isteklo</span>'}</td></tr>`).join('')}
  <tr><td class="num muted">—</td><td class="name">Osnovni rabat kupca</td><td class="t2">ako nijedno pravilo ne važi: rabat iz šifarnika subjekta</td><td class="num">po kupcu</td><td>stalno</td><td><span class="chip ok">Važi danas</span></td></tr>
  </tbody></table></div></div>
  <div class="card"><div class="card-h"><h2>Probaj: koja cijena važi?</h2><div class="right">${confirmTag('Popusti se ne sabiraju – potvrditi')}</div></div><div class="card-b"><div class="form-grid">
    <div class="field" style="grid-column:span 2"><label for="ftK">Kupac</label><select class="inp" id="ftK">${KUP.map(k => `<option value="${k.id}" ${k.id === STATE.ft.kupId ? 'selected' : ''}>${esc(k.naziv)} (${k.grupa})</option>`).join('')}</select></div>
    <div class="field" style="grid-column:span 2"><label for="ftA">Artikl</label><select class="inp" id="ftA">${ART.map(a => `<option value="${a.id}" ${a.id === STATE.ft.artId ? 'selected' : ''}>${a.sifra} · ${esc(a.naziv)}</option>`).join('')}</select></div>
    <div class="field"><label for="ftQ">Količina</label><input class="inp n" id="ftQ" inputmode="decimal" value="${fmt(STATE.ft.kol, 0)}"></div>
  </div><div id="ftOut" style="margin-top:14px"></div></div></div>`;
  const calc = () => { const k = KUP[STATE.ft.kupId], a = ART[STATE.ft.artId]; const r = rabatFor(k, a, STATE.ft.kol); const c = r2(a.vp * (1 - r.popust / 100));
    $('#ftOut').innerHTML = `<div class="kpis"><div class="kpi"><div class="lbl">VP cijena</div><div class="val">${fmt(a.vp)} <small>KM</small></div><div class="sub">${grpPath(a.grupa)}</div></div><div class="kpi"><div class="lbl">Primijenjeno</div><div class="val" style="font-size:16px;white-space:normal">${esc(r.naziv)}</div><div class="sub">popust ${fmt(r.popust, 0)} %</div></div><div class="kpi"><div class="lbl">Cijena za kupca</div><div class="val">${fmt(c)} <small>KM</small></div><div class="sub">iznos ${km(c * STATE.ft.kol)} bez PDV</div></div></div>
    ${r.m.length > 1 ? `<p class="t2" style="margin:10px 0 0;font-size:13px">Važi ${r.m.length} pravila: ${r.m.map(f => esc(f.naziv) + ' (' + f.popust + ' %)').join(', ')}. Bira se ${FORM_MODE === 'prioritet' ? 'prvo po prioritetu' : 'najveći popust'}.</p>` : ''}`; };
  $('#ftK').onchange = e => { STATE.ft.kupId = +e.target.value; calc(); };
  $('#ftA').onchange = e => { STATE.ft.artId = +e.target.value; calc(); };
  $('#ftQ').oninput = e => { STATE.ft.kol = parseNum(e.target.value); calc(); };
  $('#fMode').onclick = e => { const b = e.target.closest('button'); if (!b) return; FORM_MODE = b.dataset.m; ROUTES.formule(); };
  $('#fNew').onclick = () => toast('Novo pravilo: biraš kupca ili grupu kupaca, grupu artikala, količinu, period i popust.');
  calc();
};

/* ---------- SERIJSKI BROJEVI ---------- */
function serStatus(x){ return x.status === 'Prodat' ? '<span class="chip info">Prodat</span>' : x.status === 'Na servisu' ? '<span class="chip warn">Na servisu</span>' : '<span class="chip ok">' + (x.povrat ? 'Na stanju (povrat)' : 'Na stanju') + '</span>'; }
function garChip(x){ if (!x.garDo) return '—'; const d = daysBetween(TODAY, x.garDo); return fd(x.garDo) + (d < 0 ? ' <span class="chip mute plain">istekla</span>' : d < 60 ? ' <span class="chip warn plain">ističe</span>' : ''); }
ROUTES.serijski = () => {
  setTitle('Serijski brojevi', 'Roba');
  const st = STATE.serSt || '';
  $('#view').innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Praćenih komada</div><div class="val">${SERIJE.length}</div><div class="sub">${ART.filter(a => a.serijski).length} artikala sa serijskim brojem</div></div>
    <div class="kpi"><div class="lbl">Na stanju</div><div class="val">${SERIJE.filter(x => x.status === 'Na stanju').length}</div><div class="sub">mora biti jednako stanju zalihe</div></div>
    <div class="kpi"><div class="lbl">Prodato, u garanciji</div><div class="val">${SERIJE.filter(x => x.garDo && x.garDo >= TODAY).length}</div><div class="sub">garancija 24 mjeseca</div></div>
    <div class="kpi"><div class="lbl">Na servisu</div><div class="val">${SERIJE.filter(x => x.status === 'Na servisu').length}</div><div class="sub"><a href="#servis">otvori servis</a></div></div>
  </div>
  <div class="card"><div class="card-h"><div class="toolbar" style="width:100%"><input class="inp grow" id="snQ" placeholder="Serijski broj, artikl ili kupac…" style="min-width:160px">
    <select class="inp" id="snS"><option value="">Svi statusi</option>${['Na stanju','Prodat','Na servisu'].map(s => `<option ${st === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
  <div class="table-wrap"><table class="tbl"><thead><tr><th>Serijski broj</th><th>Artikl</th><th>Ulaz</th><th>Status</th><th>Kupac</th><th>Račun</th><th>Garancija do</th></tr></thead><tbody id="snBody"></tbody></table></div></div>`;
  const draw = () => { const q = ($('#snQ').value || '').toLowerCase();
    $('#snBody').innerHTML = [...SERIJE].sort((a, b) => (b.prodato || b.ulDatum) - (a.prodato || a.ulDatum)).filter(x => (!STATE.serSt || x.status === STATE.serSt) && (!q || (x.sn + ART[x.artId].naziv + (x.kupId != null ? KUP[x.kupId].naziv : '')).toLowerCase().includes(q))).map(x => `<tr class="click" data-sn="${x.sn}"><td class="mono"><b>${x.sn}</b></td><td>${esc(ART[x.artId].naziv)}<div class="sub mono">${ART[x.artId].sifra}</div></td><td class="mono">${x.ulDok}<div class="sub" style="font-family:var(--font)">${fd(x.ulDatum)}</div></td><td>${serStatus(x)}</td><td>${x.kupId != null ? esc(KUP[x.kupId].naziv) : '—'}</td><td class="mono">${x.racun || '—'}</td><td>${garChip(x)}</td></tr>`).join('');
    $('#snBody').querySelectorAll('tr').forEach(tr => tr.onclick = () => openSerijski(tr.dataset.sn)); };
  $('#snQ').oninput = draw; $('#snS').onchange = e => { STATE.serSt = e.target.value; draw(); };
  draw();
};
function openSerijski(sn){
  const x = SERIJE.find(s => s.sn === sn), a = ART[x.artId];
  const ev = [[x.ulDatum, 'Ulaz na zalihu', x.ulDok === 'PS' ? 'Početno stanje' : x.ulDok + ' · ' + DOB[a.dobId].naziv]];
  if (x.prodato) ev.push([x.prodato, 'Prodat', x.racun + ' · ' + KUP[x.kupId].naziv]);
  SERVIS.filter(s => s.sn === sn).forEach(s => ev.push([s.datum, 'Servis ' + s.broj, s.kvar + ' · ' + s.status]));
  if (x.povrat) ev.push([TODAY, 'Povrat od kupca', x.povrat]);
  ev.sort((p, q) => p[0] - q[0]);
  modal('Serijski broj ' + sn, `<dl class="kv"><dt>Artikl</dt><dd>${a.sifra} · ${esc(a.naziv)}</dd><dt>Status</dt><dd>${serStatus(x)}</dd><dt>Garancija do</dt><dd>${garChip(x)}</dd></dl>
    <div class="timeline">${ev.map(e => `<div class="ev"><b>${e[1]}</b> <span class="muted">· ${fd(e[0])}</span><div class="t2" style="font-size:13px">${esc(e[2])}</div></div>`).join('')}</div>`,
    `<button class="btn" data-act="srv">Otvori servisni nalog</button><button class="btn btn-primary" data-close>Zatvori</button>`);
  $('[data-act="srv"]').onclick = () => toast('Novi servisni nalog (600) se otvara s već upisanim artiklom, kupcem i garancijom.');
}

/* ---------- NARUDŽBE ---------- */
ROUTES.nkupci = () => renderNarudzbe('K');
ROUTES.ndob = () => renderNarudzbe('D');
const narChip = s => ['Isporučena','Primljena'].includes(s) ? `<span class="chip ok">${s}</span>` : s === 'Otkazana' ? `<span class="chip mute">${s}</span>` : s.startsWith('Djelimično') ? `<span class="chip warn">${s}</span>` : `<span class="chip info">${s}</span>`;
function renderNarudzbe(t){
  const K = t === 'K', L = K ? NK : ND;
  setTitle(K ? 'Narudžbe kupaca' : 'Narudžbe dobavljačima', 'Narudžbe · vrsta ' + (K ? '210' : '200'));
  const val = n => sum(n.stavke, s => s.kol * s.cijena), rest = n => sum(n.stavke, s => (s.kol - s.isp) * s.cijena);
  const open = L.filter(isOpen), rok = n => K ? n.rok : n.ocekivano;
  $('#view').innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Otvorene narudžbe</div><div class="val">${open.length}</div><div class="sub">od ${L.length} ukupno</div></div>
    <div class="kpi"><div class="lbl">${K ? 'Rezervisano (neisporučeno)' : 'Naručeno, nije stiglo'}</div><div class="val">${fmt(sum(open, rest))} <small>KM</small></div><div class="sub">${K ? 'po VP cijeni' : 'po nabavnoj cijeni'}</div></div>
    <div class="kpi"><div class="lbl">${K ? 'Hitne' : 'Stiže u 7 dana'}</div><div class="val">${K ? open.filter(n => n.prioritet === 'Hitno').length : open.filter(n => n.ocekivano >= TODAY && daysBetween(TODAY, n.ocekivano) <= 7).length}</div><div class="sub">${K ? 'prioritet isporuke' : 'očekivani prijem'}</div></div>
    <div class="kpi alert"><div class="lbl">Kasne</div><div class="val">${open.filter(n => rok(n) < TODAY).length}</div><div class="sub">rok prošao</div></div>
  </div>
  <div class="card"><div class="card-h"><h2>${K ? 'Narudžbe kupaca' : 'Narudžbe dobavljačima'}</h2><div class="right"><button class="btn btn-primary" id="nNew">${ico('plus')}Nova narudžba</button></div></div>
  <div class="table-wrap"><table class="tbl"><thead><tr><th>Broj</th><th>Datum</th><th>${K ? 'Kupac' : 'Dobavljač'}</th><th>${K ? 'Rok isporuke' : 'Očekivano'}</th>${K ? '<th>Prioritet</th>' : ''}<th class="num">Vrijednost</th><th style="min-width:130px">${K ? 'Isporučeno' : 'Primljeno'}</th><th>Status</th></tr></thead><tbody>
  ${[...L].reverse().map((n, i) => { const p = val(n) ? (1 - rest(n) / val(n)) * 100 : 0; const late = isOpen(n) && rok(n) < TODAY;
    return `<tr class="click" data-b="${n.broj}"><td class="mono">${n.broj}</td><td>${fd(n.datum)}</td><td class="name">${esc(K ? KUP[n.kupId].naziv : DOB[n.dobId].naziv)}</td><td>${fd(rok(n))}${late ? ' <span class="chip bad plain">kasni</span>' : ''}</td>${K ? `<td>${n.prioritet === 'Hitno' ? '<span class="chip warn plain">Hitno</span>' : '<span class="t2">Normalno</span>'}</td>` : ''}<td class="num">${fmt(val(n))}</td><td><div class="bar-in" style="margin:0"><span style="width:${p.toFixed(0)}%;background:${p >= 99.9 ? 'var(--ok)' : 'var(--s1)'}"></span></div><div class="sub">${fmt(p, 0)} %</div></td><td>${narChip(n.status)}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
  $('#nNew').onclick = () => toast(K ? 'Nova narudžba kupca rezerviše robu; iz nje se jednim klikom pravi otpremnica i račun.' : 'Nova narudžba dobavljaču; prijedlog količina iz artikala ispod minimuma (faza 1).');
  document.querySelectorAll('tr[data-b]').forEach(tr => tr.onclick = () => openNarudzba(t, tr.dataset.b));
}
function openNarudzba(t, broj){
  const K = t === 'K', n = (K ? NK : ND).find(x => x.broj === broj);
  modal(`${K ? 'Narudžba kupca' : 'Narudžba dobavljaču'} ${n.broj}`, `<dl class="kv"><dt>${K ? 'Kupac' : 'Dobavljač'}</dt><dd>${esc(K ? KUP[n.kupId].naziv : DOB[n.dobId].naziv)}</dd><dt>Datum</dt><dd>${fd(n.datum)}</dd><dt>${K ? 'Rok isporuke' : 'Očekivano'}</dt><dd>${fd(K ? n.rok : n.ocekivano)}</dd><dt>Status</dt><dd>${narChip(n.status)}</dd></dl>
    <div class="table-wrap" style="border:1px solid var(--border);border-radius:8px"><table class="tbl"><thead><tr><th>Artikl</th><th class="num">Naručeno</th><th class="num">${K ? 'Isporučeno' : 'Primljeno'}</th><th class="num">Ostalo</th>${K ? '<th class="num">Na stanju</th>' : ''}<th class="num">Cijena</th></tr></thead><tbody>
    ${n.stavke.map(s => { const a = ART[s.artId], o = s.kol - s.isp; return `<tr><td><span class="mono">${a.sifra}</span> ${esc(a.naziv)}</td><td class="num">${fq(s.kol, a.jm)}</td><td class="num">${fq(s.isp, a.jm)}</td><td class="num"><b>${fq(o, a.jm)}</b></td>${K ? `<td class="num" style="${a.stanje < o ? 'color:var(--bad)' : ''}">${fq(a.stanje, a.jm)}</td>` : ''}<td class="num">${fmt(s.cijena)}</td></tr>`; }).join('')}</tbody></table></div>`,
    `${isOpen(n) ? `<button class="btn btn-primary" data-act="mk">${K ? ico('out') + 'Napravi otpremnicu i račun' : ico('in') + 'Napravi kalkulaciju (prijem)'}</button>` : ''}<button class="btn" data-close>Zatvori</button>`, true);

function kifRows(mj){
  const rows = [];
  IZLAZ.filter(d => mKey(d.datum) === mj).forEach(d => { const k = KUP[d.kupId]; rows.push({ datum:d.datum, broj:d.broj, partner:k.naziv, id:k.jib || '—', vrsta:k.tip === 'Firma' ? 'VP račun' : 'VP račun – krajnja potrošnja', osn:d.osnovica, pdv:d.pdv, uk:d.ukupno }); });
  STORNA.filter(s => mKey(s.datum) === mj).forEach(s => { const k = KUP[s.kupId]; rows.push({ datum:s.datum, broj:s.broj, partner:k.naziv, id:k.jib || '—', vrsta:'Storno (' + s.ref + ')', osn:s.osnovica, pdv:s.pdv, uk:s.ukupno, neg:true }); });
  POVRAT.filter(p => mKey(p.datum) === mj).forEach(p => { const k = KUP[p.kupId]; rows.push({ datum:p.datum, broj:p.broj, partner:k.naziv, id:k.jib || '—', vrsta:'Povrat (' + p.ref + ')', osn:p.osnovica, pdv:p.pdv, uk:p.ukupno, neg:true }); });
  MP.filter(m => mKey(m.datum) === mj).forEach(m => rows.push({ datum:m.datum, broj:m.broj, partner:'Maloprodaja – dnevni promet', id:'—', vrsta:'MP zbirno (fiskalni Z)', osn:m.osnovica, pdv:m.pdv, uk:m.ukupno }));
  return rows.sort((a, b) => a.datum - b.datum || a.broj.localeCompare(b.broj));
}
function kufRows(mj){
  const rows = [];
  ULAZ.filter(u => mKey(u.datum) === mj).forEach(u => { const d = DOB[u.dobId]; rows.push({ datum:u.datum, broj:u.brojDob, partner:d.naziv, id:d.idBroj, vrsta:d.tip === 'EU' ? 'Uvoz – faktura (bez PDV)' : 'Domaća faktura – roba', osn:u.k.fakturna, pdv:u.pdv, uk:u.ukupno, int:u.kal }); });
  JCI.filter(j => mKey(j.datum) === mj).forEach(j => rows.push({ datum:j.datum, broj:j.broj, partner:'UIO – jedinstvena carinska isprava', id:'—', vrsta:'Uvoz – PDV iz JCI', osn:j.osnovica, pdv:j.pdv, uk:j.pdv, int:j.opis }));
  USLUGE.filter(u => mKey(u.datum) === mj).forEach(u => { const d = DOB[u.dobId]; rows.push({ datum:u.datum, broj:u.broj, partner:d.naziv, id:d.idBroj, vrsta:'Usluga', osn:u.osnovica, pdv:u.pdv, uk:u.ukupno, int:u.opis }); });
  return rows.sort((a, b) => a.datum - b.datum);
}

function exportCSV(tip, mj, rows){
  const head = ['Rb','Datum','Broj dokumenta','Partner','ID/PDV broj','Vrsta','Osnovica','PDV','Ukupno'];
  const lines = [head.join(';'), ...rows.map((r, i) => [i + 1, fd(r.datum), r.broj, r.partner, r.id, r.vrsta, fmt(r.osn).replace('−','-'), fmt(r.pdv).replace('−','-'), fmt(r.uk).replace('−','-')].map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'))];
  const name = `${tip}_${mj}.csv`;
  try { const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  audit(new Date(), 'Admin', `Izvezao ${tip} za ${MJESECI[+mj.slice(5) - 1]} 2026 (${rows.length} redova)`, name);
  toast(`Pripremljen ${name} (${rows.length} redova, otvara se u Excelu). Ako se preuzimanje ne pokrene u web pregledu, otvori lokalnu verziju previewa.`);
}

  kasa:['Kasa (maloprodaja)','Faza 2',['Brzi ekran kase za dodir i bar-kod čitač','Slanje računa na Tring FP1 kroz zaseban modul fiskalizacije','Gotovina, kartica, kombinovano plaćanje','Rad i kad fiskalni uređaj nije dostupan (red čekanja)']],
  dnevni:['Dnevni izvještaj','Faza 2',['Presjek stanja i Z izvještaj s fiskalnog','Promet po načinu plaćanja i artiklima','Automatski zbirni red u KIF']],
  nivelacije:['Nivelacije','Faza 2',['Promjena maloprodajnih cijena uz zapisnik','Razlika u vrijednosti zalihe po prodajnoj cijeni','Prenos novih cijena na fiskalni uređaj']],
  mpkalk:['Maloprodajne kalkulacije','Faza 2',['Zaliha po prodajnoj cijeni (MPC s PDV)','Ukalkulisana RUC i PDV','Prenos iz veleprodaje u maloprodaju (međuskladišnica)']],
  uvoz:['Uvoz iz starog programa','Faza 3',['Uvoz artikala, partnera i početnih stanja iz Excela','Pregled prije uvoza i izvještaj o greškama','Mapiranje kolona starog programa']],
  poredjenje:['Poređenje KIF/KUF','Faza 3',['Učitaj KIF/KUF iz starog programa (Excel)','Poređenje red po red sa Mega Robno','Označene razlike: nedostaje, različit iznos, različit datum']]
};
Object.entries(SOON).forEach(([id, [t, faza, items]]) => ROUTES[id] = () => {
  setTitle(t, faza);
  $('#view').innerHTML = `<div class="soon-page"><div class="card soon-card"><div class="card-h"><h2>${t}</h2><div class="right"><span class="chip info plain">${faza} · uskoro</span></div></div><div class="card-b"><p class="t2" style="margin:0">Ovaj modul je predviđen u arhitekturi i meniju, ali se pravi u ${faza.toLowerCase()}. Planirano:</p><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div></div></div>`;
});

/* =====================================================================
   MODAL, TOAST, PRETRAGA, TEMA, MENI
   ===================================================================== */
function modal(title, body, foot, wide){
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn x" data-close aria-label="Zatvori">${ico('x')}</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot || ''}</div></div></div>`;
  $('#mbg').onclick = e => { if (e.target.id === 'mbg' || e.target.closest('[data-close]')) closeModal(); };
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function askConfirm(title, text, okLbl, onOk){
  modal(title, `<p style="margin:0">${text}</p>`, `<button class="btn" data-close>Odustani</button><button class="btn btn-primary" id="okBtn">${okLbl}</button>`);
  $('#okBtn').onclick = () => { closeModal(); onOk(); };
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5200); }

function doSearch(q){
  const box = $('#searchRes'); q = q.trim().toLowerCase();
  if (q.length < 2){ box.hidden = true; return; }
  const arts = ART.filter(a => (a.sifra + ' ' + a.naziv).toLowerCase().includes(q)).slice(0, 6);
  const parts = [...DOBS.map(d => ({ t:'dob', d })), ...KUP.map(k => ({ t:'kup', d:k }))].filter(x => x.d.naziv.toLowerCase().includes(q)).slice(0, 5);
  const docs = [...IZLAZ.map(d => ({ t:'rn', d, b:d.broj })), ...ULAZ.map(u => ({ t:'kal', d:u, b:u.kal + ' ' + u.brojDob }))].filter(x => x.b.toLowerCase().includes(q)).slice(0, 5);
  const sers = SERIJE.filter(x => x.sn.toLowerCase().includes(q)).slice(0, 4);
  const nars = [...NK.map(n => ({ t:'nk', n })), ...ND.map(n => ({ t:'nd', n }))].filter(x => x.n.broj.toLowerCase().includes(q)).slice(0, 4);
  let h = '';
  if (arts.length) h += '<div class="grp">Artikli</div>' + arts.map(a => `<button data-s="art:${a.id}"><span class="mono">${a.sifra}</span><span style="flex:1">${esc(a.naziv)}</span><span class="muted">${fq(a.stanje, a.jm)} ${a.jm}</span></button>`).join('');
  if (parts.length) h += '<div class="grp">Partneri</div>' + parts.map(x => `<button data-s="${x.t}:${x.d.id}"><span style="flex:1">${esc(x.d.naziv)}</span><span class="muted">${x.t === 'dob' ? 'dobavljač' : 'kupac'}</span></button>`).join('');
  if (docs.length) h += '<div class="grp">Dokumenti</div>' + docs.map(x => `<button data-s="${x.t}:${x.d.id}"><span class="mono">${x.t === 'rn' ? x.d.broj : x.d.kal}</span><span style="flex:1">${esc(x.t === 'rn' ? KUP[x.d.kupId].naziv : DOB[x.d.dobId].naziv)}</span><span class="muted">${fd(x.d.datum)}</span></button>`).join('');
  if (sers.length) h += '<div class="grp">Serijski brojevi</div>' + sers.map(x => `<button data-s="sn:${x.sn}"><span class="mono">${x.sn}</span><span style="flex:1">${esc(ART[x.artId].naziv)}</span><span class="muted">${x.status}</span></button>`).join('');
  if (nars.length) h += '<div class="grp">Narudžbe</div>' + nars.map(x => `<button data-s="${x.t}:${x.n.broj}"><span class="mono">${x.n.broj}</span><span style="flex:1">${esc(x.t === 'nk' ? KUP[x.n.kupId].naziv : DOB[x.n.dobId].naziv)}</span><span class="muted">${x.n.status}</span></button>`).join('');
  box.innerHTML = h || '<div class="empty">Ništa nije pronađeno.</div>'; box.hidden = false;
  box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const [t, id] = b.dataset.s.split(':'); box.hidden = true; $('#search').value = '';
    if (t === 'art') openKartica(+id); else if (t === 'rn') openDoc('racun', IZLAZ.find(d => d.id === +id)); else if (t === 'kal') go('ulaz', () => openKalk(+id)); else if (t === 'sn') openSerijski(id); else if (t === 'nk' || t === 'nd') go(t === 'nk' ? 'nkupci' : 'ndob', () => openNarudzba(t === 'nk' ? 'K' : 'D', id)); else { STATE.subjTip = t === 'dob' ? 'D' : 'K'; go('subjekti', () => openSubjekt((t === 'dob' ? 'D' : 'K') + id)); } });
}
function getTheme(){ const t = document.documentElement.dataset.theme; if (t) return t; return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function paintThemeBtn(){ $('#themeBtn').innerHTML = ico(getTheme() === 'dark' ? 'sun' : 'moon'); }
function applyBrand(){ $('#brandName').textContent = CONFIG.appName; $('#brandMark').textContent = CONFIG.appName.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); $('#ver').textContent = 'v' + CONFIG.version; }
function openDrawer(){ $('#sidebar').classList.add('open'); $('#overlay').hidden = false; }
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#overlay').hidden = true; }

(function init(){
  try { const t = localStorage.getItem('mr-tema'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  applyBrand(); paintThemeBtn();
  $('#burger').innerHTML = ico('menu'); $('#searchIco').innerHTML = ico('search'); $('#ndIco').innerHTML = ico('plus');
  $('#ndBtn').onclick = () => { if ($('#ndMenu').hidden) openNewDocMenu(); else $('#ndMenu').hidden = true; };
  $('#burger').onclick = openDrawer; $('#overlay').onclick = closeDrawer;
  $('#themeBtn').onclick = () => { const n = getTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('mr-tema', n); } catch (e) {} paintThemeBtn(); };
  $('#search').oninput = e => doSearch(e.target.value);
  document.addEventListener('click', e => { if (!e.target.closest('#searchBox')) $('#searchRes').hidden = true; if (!e.target.closest('#ndBox')) $('#ndMenu').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeModal(); $('#searchRes').hidden = true; $('#ndMenu').hidden = true; closeDrawer(); } if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('#search').focus(); } });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
